[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-platform"
version = "1.0.0"
description = "Production reference implementation of a 9-layer agentic system: channels, AI gateway, orchestration, models, MCP tools, knowledge, async backbone, trust layer, CI/CD."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt[crypto]>=2.8",
  "redis>=5.0",
  "asyncpg>=0.29",
  "aiokafka>=0.11",
  "prometheus-client>=0.20",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-httpx>=0.46b0",
  "langgraph>=1.0",
  "litellm>=1.50",
  "mcp>=1.12,<2",
  "networkx>=3.2",
  "pyyaml>=6",
]

[project.optional-dependencies]
eval = ["ragas>=0.2", "datasets"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "fakeredis>=2.23"]

[project.scripts]
agentic-migrate = "agentic.common.migrate:main"
agentic-ingest = "agentic.knowledge.ingest:main"
agentic-killswitch = "agentic.trust.killswitch:main"
agentic-evals = "agentic.trust.evals:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S105", "S106", "S311", "B008", "E501", "S608"]
