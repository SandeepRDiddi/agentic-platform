{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  labels: {{- include "agentic.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef: {{ toYaml .Values.externalSecret.secretStoreRef | nindent 4 }}
  target: { name: {{ .Values.secretName }}, creationPolicy: Owner }
  data:
    {{- range .Values.externalSecret.keys }}
    - { secretKey: {{ . }}, remoteRef: { key: {{ . | lower | replace "_" "-" }} } }
    {{- end }}
{{- end }}
