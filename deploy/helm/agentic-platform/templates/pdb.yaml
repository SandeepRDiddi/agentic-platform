{{- if .Values.podDisruptionBudget.enabled }}
{{- $full := include "agentic.fullname" . -}}
{{- range $name, $svc := .Values.services }}
{{- if gt (int ($svc.replicas | default 1)) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $full }}-{{ $name }}
  labels: {{- include "agentic.labels" $ | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "agentic.selector" (dict "root" $ "name" $name) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
