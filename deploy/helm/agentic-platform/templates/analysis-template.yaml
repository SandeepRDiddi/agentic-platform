{{- $full := include "agentic.fullname" . -}}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ $full }}-canary-gate
  labels: {{- include "agentic.labels" . | nindent 4 }}
spec:
  args:
    - name: canary-hash        # rollouts-pod-template-hash of the canary ReplicaSet
    - name: metric-service     # component label (gateway | channels | orchestrator)
    - name: eval-url
    - name: eval-path
  metrics:
    - name: success-rate
      interval: 30s
      count: 6
      failureLimit: 1
      successCondition: result[0] >= {{ .Values.analysis.minSuccessRate }}
      provider:
        prometheus:
          address: {{ .Values.analysis.prometheusAddress }}
          query: |
            sum(rate(agentic_http_requests_total{service="{{`{{args.metric-service}}`}}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}",status!~"5.."}[2m]))
            /
            clamp_min(sum(rate(agentic_http_requests_total{service="{{`{{args.metric-service}}`}}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}[2m])), 0.001)
    - name: p95-latency
      interval: 30s
      count: 6
      failureLimit: 1
      successCondition: result[0] <= {{ .Values.analysis.maxP95Seconds }}
      provider:
        prometheus:
          address: {{ .Values.analysis.prometheusAddress }}
          query: |
            histogram_quantile(0.95, sum by (le) (rate(agentic_http_request_seconds_bucket{service="{{`{{args.metric-service}}`}}",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}[2m])))
    - name: run-failure-ratio
      interval: 30s
      count: 6
      failureLimit: 1
      successCondition: result[0] <= {{ .Values.analysis.maxRunFailureRatio }}
      provider:
        prometheus:
          address: {{ .Values.analysis.prometheusAddress }}
          query: |
            (sum(rate(agentic_agent_runs_total{status="failed",rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}[5m])) or vector(0))
            /
            clamp_min(sum(rate(agentic_agent_runs_total{rollouts_pod_template_hash="{{`{{args.canary-hash}}`}}"}[5m])), 0.001)
{{- if .Values.analysis.evalGate.enabled }}
    - name: eval-gate
      provider:
        job:
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 900
            template:
              metadata:
                labels: { agentic.io/job: eval-gate }
              spec:
                restartPolicy: Never
                serviceAccountName: {{ $full }}
                automountServiceAccountToken: false
                securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
                containers:
                  - name: evals
                    image: {{ include "agentic.image" . | quote }}
                    env:
                      - { name: SERVICE, value: evals }
                    args:
                      - --target=http
                      - --url={{`{{args.eval-url}}`}}
                      - --path={{`{{args.eval-path}}`}}
                      - --mint-token
                      - --tenant={{ .Values.analysis.evalGate.tenant }}
                      {{- if .Values.analysis.evalGate.ragas }}
                      - --ragas
                      {{- end }}
                    envFrom:
                      - configMapRef: { name: {{ $full }}-config }
                      - secretRef: { name: {{ .Values.secretName }} }
                    securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
                    volumeMounts: [{ name: tmp, mountPath: /tmp }]
                volumes: [{ name: tmp, emptyDir: {} }]
{{- end }}
