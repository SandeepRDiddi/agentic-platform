{{- if .Values.networkPolicy.enabled }}
{{- $full := include "agentic.fullname" . -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-default-deny
  labels: {{- include "agentic.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} }
  policyTypes: [Ingress]
{{- range $name, $svc := .Values.services }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-{{ $name }}
  labels: {{- include "agentic.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentic.selector" (dict "root" $ "name" $name) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    {{- range $from := $svc.allowFrom }}
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $from }} }
      ports: [{ port: {{ $svc.port | int }} }]
    {{- end }}
    {{- if $svc.ingressPaths }}
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $.Values.networkPolicy.ingressControllerNamespace }} }
      ports: [{ port: {{ $svc.port | int }} }]
    {{- end }}
    {{- if $.Values.serviceMonitor.enabled }}
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ $.Values.networkPolicy.monitoringNamespace }} }
      ports: [{ port: {{ $svc.port | int }} }]
    {{- end }}
    {{- if and $.Values.analysis.evalGate.enabled (eq $svc.kind "rollout") }}
    - from:
        - podSelector:
            matchLabels: { agentic.io/job: eval-gate }
      ports: [{ port: {{ $svc.port | int }} }]
    {{- end }}
{{- end }}
{{- end }}
