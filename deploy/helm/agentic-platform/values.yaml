# ── image (CI bumps image.tag in values-<env>.yaml; ArgoCD syncs) ───────────────────────────
image:
  repository: myregistry.azurecr.io/agentic-platform
  tag: "1.0.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Existing Secret holding: JWT_SECRET IDENTITY_SECRET DATABASE_URL REDIS_URL KAFKA_SASL_USERNAME/PASSWORD
# provider keys (ANTHROPIC_API_KEY, OPENAI_API_KEY), SLACK_SIGNING_SECRET SLACK_BOT_TOKEN,
# TEAMS_APP_ID TEAMS_APP_PASSWORD, LANGFUSE_PUBLIC_KEY LANGFUSE_SECRET_KEY, API_KEYS_JSON
secretName: agentic-secrets
# Optional: have External Secrets Operator build that Secret from Azure Key Vault.
externalSecret:
  enabled: false
  secretStoreRef: { name: azure-keyvault, kind: ClusterSecretStore }
  keys: []            # e.g. [JWT_SECRET, IDENTITY_SECRET, DATABASE_URL, ...] (Key Vault secret names)

# Non-secret environment → ConfigMap (service URLs are generated by the chart)
config:
  ENV: prod
  LLM_MODE: live
  LOG_LEVEL: INFO
  KILLSWITCH_FAIL_CLOSED: "true"
  PII_MODE: redact
  APPROVER_USERS: ""
  APPROVAL_FOUR_EYES: "true"
  RATE_LIMIT_PER_MINUTE: "120"
  TENANT_DAILY_BUDGET_USD: "100"
  JWT_ALGORITHMS: RS256
  JWKS_URL: ""                      # Entra ID: https://login.microsoftonline.com/<tenant>/discovery/v2.0/keys
  JWT_ISSUER: ""
  JWT_AUDIENCE: ""
  CHANNEL_TENANT: default
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
  LANGFUSE_HOST: ""
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_MECHANISM: PLAIN
kafka:
  bootstrap: kafka-kafka-bootstrap.kafka:9092      # Strimzi service, or <ns>.servicebus.windows.net:9093 (Event Hubs)
  sasl: { enabled: true, secretName: agentic-secrets, usernameKey: KAFKA_SASL_USERNAME, passwordKey: KAFKA_SASL_PASSWORD }  # used by KEDA lag scaler

serviceAccount:
  create: true
  annotations: {}                 # e.g. azure.workload.identity/client-id: <guid>

ingress:
  className: nginx
  host: agents.example.com
  tls: { enabled: true, secretName: agentic-tls }
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: 1m

# ── progressive delivery ────────────────────────────────────────────────────────────────
rollout:
  edgeSteps:                      # gateway + channels: real 5% traffic via NGINX
    - setWeight: 5
    - pause: { duration: 3m }
    - analysis: { templates: [{ templateName: canary-gate }], args: [] }
    - setWeight: 25
    - pause: { duration: 5m }
    - setWeight: 50
    - pause: { duration: 5m }
  internalSteps:                  # orchestrator: eval-gated, then replica-scaled promotion
    - setWeight: 20
    - analysis: { templates: [{ templateName: canary-gate }] }
    - setWeight: 50
    - pause: { duration: 5m }
analysis:
  prometheusAddress: http://prometheus-operated.monitoring:9090
  minSuccessRate: "0.98"
  maxP95Seconds: "30"
  maxRunFailureRatio: "0.05"
  evalGate:
    enabled: true
    tenant: eval
    ragas: false                  # true = also gate on Ragas faithfulness/answer-relevancy (needs judge-model key)

# ── workloads ───────────────────────────────────────────────────────────────────────────
services:
  channels:
    kind: rollout
    port: 8000
    replicas: 2
    ingressPaths: ["/"]
    allowFrom: []
    evalPath: /v1/agent/runs
    resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 384Mi } }
    autoscaling: { min: 2, max: 10, cpu: 70 }
  gateway:
    kind: rollout
    port: 8001
    replicas: 3
    ingressPaths: ["/v1"]
    allowFrom: [channels, orchestrator, worker, tools]
    evalPath: /v1/agent/runs
    resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { memory: 512Mi } }
    autoscaling: { min: 3, max: 20, cpu: 65 }
  orchestrator:
    kind: rollout
    port: 8002
    replicas: 3
    allowFrom: [gateway]
    evalPath: /v1/runs
    resources: { requests: { cpu: 250m, memory: 384Mi }, limits: { memory: 768Mi } }
    autoscaling: { min: 3, max: 20, cpu: 65 }
  tools:
    kind: deployment
    port: 8003
    replicas: 2
    allowFrom: [orchestrator, worker]
    resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 384Mi } }
    autoscaling: { min: 2, max: 10, cpu: 70 }
  internal-api:
    kind: deployment
    port: 8004
    replicas: 2
    allowFrom: [tools]
    resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
  worker:
    kind: deployment
    port: 9100                    # metrics only
    portName: metrics
    probes: metrics
    replicas: 2
    terminationGracePeriodSeconds: 660   # finish in-flight task (TASK_TIMEOUT_SECONDS=600)
    allowFrom: []
    resources: { requests: { cpu: 250m, memory: 384Mi }, limits: { memory: 768Mi } }
    keda: { enabled: true, min: 2, max: 40, lagThreshold: "5", cooldownSeconds: 120 }

migrate:
  enabled: true                   # PreSync/pre-upgrade Job: agentic-migrate

serviceMonitor: { enabled: true, interval: 15s }
networkPolicy: { enabled: true, ingressControllerNamespace: ingress-nginx, monitoringNamespace: monitoring }
podDisruptionBudget: { enabled: true }
