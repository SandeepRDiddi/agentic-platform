# Local full stack:  cp .env.example .env && docker compose up --build
# UI: http://localhost:8000   Gateway API: http://localhost:8001   Jaeger: http://localhost:16686
name: agentic-platform
x-app: &app
  build: { context: ., dockerfile: deploy/docker/Dockerfile }
  env_file: [.env]
  environment: &env
    ENV: dev
    DATABASE_URL: postgresql://agentic:agentic@postgres:5432/agentic
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP: kafka:9092
    GATEWAY_URL: http://gateway:8001
    ORCHESTRATOR_URL: http://orchestrator:8002
    MCP_URL: http://tools:8003/mcp
    INTERNAL_API_URL: http://internal-api:8004
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    DEV_TOKEN_ENDPOINT: "true"
  restart: unless-stopped
  depends_on: &deps
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
    kafka: { condition: service_healthy }

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: agentic, POSTGRES_PASSWORD: agentic, POSTGRES_DB: agentic }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U agentic"], interval: 5s, retries: 20 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }

  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686"]

  migrate:
    <<: *app
    environment: { <<: *env, SERVICE: migrate }
    restart: "no"
    depends_on: { postgres: { condition: service_healthy } }

  seed:
    <<: *app
    environment: { <<: *env, SERVICE: ingest, INGEST_ARGS: "--communities" }
    restart: "no"
    depends_on: { <<: *deps, gateway: { condition: service_healthy } }

  internal-api:
    <<: *app
    environment: { <<: *env, SERVICE: internal-api }
  tools:
    <<: *app
    environment: { <<: *env, SERVICE: tools }
    depends_on: { <<: *deps, internal-api: { condition: service_started } }
  gateway:
    <<: *app
    environment: { <<: *env, SERVICE: gateway }
    ports: ["8001:8001"]
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/healthz')"], interval: 5s, retries: 30 }
  orchestrator:
    <<: *app
    environment: { <<: *env, SERVICE: orchestrator }
    depends_on: { <<: *deps, tools: { condition: service_started } }
  worker:
    <<: *app
    environment: { <<: *env, SERVICE: worker }
    depends_on: { <<: *deps, tools: { condition: service_started } }
  channels:
    <<: *app
    environment: { <<: *env, SERVICE: channels }
    ports: ["8000:8000"]

volumes:
  pgdata: {}
